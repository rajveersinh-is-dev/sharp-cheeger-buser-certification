[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp_cheeger_buser_certification"
version = "1.0.0"
description = "Exact characterisation and certification of the sharp two-sided Cheeger-Buser bound for finite weighted graphs: proofs, exact-arithmetic sharpness family, and exhaustive verification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "rajveersinh-is-dev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/rajveersinh-is-dev/sharp-cheeger-buser-certification"

[tool.setuptools]
py-modules = ['']
